{% extends "base.html" %}
{% block title %}404 Não Encontrado — {{ site.server_name or 'Reliquia' }}{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="mc-empty py-5">
    <div style="font-family:'Press Start 2P',monospace;font-size:4rem;color:var(--mc-gold);text-shadow:3px 3px 0 #000;line-height:1.2;">404</div>
    <h1 class="fs-4 fw-bold mt-3 mb-2 text-mc-gold">Bloco Não Encontrado</h1>
    <p class="text-mc-muted mb-4">
      Esta página não existe ou foi removida.<br>
      Talvez você tenha seguido um link antigo.
    </p>
    <div class="d-flex justify-content-center gap-2">
      <a href="{{ url_for('index') }}" class="btn btn-mc-primary">
        <i class="bi bi-house-fill me-1"></i>Início
      </a>
      <a href="{{ url_for('forum') }}" class="btn btn-mc-secondary">
        <i class="bi bi-collection-fill me-1"></i>Fórum
      </a>
    </div>
  </div>
</div>
{% endblock %}
